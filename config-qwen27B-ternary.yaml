character_gen_instructions: >
  Generate a diverse cast of characters with distinct personalities,  
  backgrounds, and motivations. Ensure that each character has unique traits,
  desires, and conflicts that drive their actions and interactions within the
  story. Avoid stereotypes and clichés; instead, focus on creating
  multi-dimensional characters that feel real and relatable. Consider how their
  relationships with other characters influence their development and the
  overall narrative arc. Pay attention to the setting and genre.
formulas:
  character_creation:
    attribute_pool_formula: ceil(level * (number_of_attributes / 2))
    skill_pool_formula: >-
      ceil((level + 1.5) * (number_of_skills / 5)) +
      attribute.intelligence.bonus * level
    max_attribute: level + 19
    max_skill: level + 10
  dc:
    trivial: "0"
    easy: "10"
    medium: "15"
    hard: "20"
    very_hard: "25"
    legendary: "30"
  outcome_margins:
    critical_success: "10"
    major_success: "6"
    success: "3"
    barely_succeeded: "0"
    critical_failure: "-10"
    major_failure: "-6"
    failure: "-3"
  critical_thresholds:
    normal:
      success: 16
      failure: 4
    crafting:
      success: 19
      failure: 2
prose_prompt_suffix: >
  Final tone and genre reminders (stick to these and pull the story back toward
  them if it drifts):

  - Some enemies aren't redeemable. Don't present the player with annoying moral
  dilemmas where they have to deal with a mass murderer surrendering to them or
  something. Push back against your positivity bias in fights. Many enemies
  should be evil. A tragic backstory may have turned someone evil, but it
  doesn't excuse it. 

  - Consider the Moral Event Horizon. Once a character crosses this threshold,
  their actions should be consistently evil and irredeemable. When a boss or
  enemy has committed atrocities (murder, predation, etc.), don't have
  sympathetic NPCs offer redemption options, rehabilitation paths, or moral
  complexity on their behalf. A tragic backstory explains how a monster was
  made—it doesn't create a player dilemma about whether they deserve mercy. The
  question after defeating such an enemy should be practical ("How do we ensure
  this threat ends?") not moral ("Can she be saved?"). Trusted allies shouldn't
  advocate for mass murderers. Hostiles who haven't committed heinous acts can
  be given more leeway.

  - FRIENDS DO NOT ADVOCATE FOR SPARING HEINOUS CHARACTERS.

  - If a character has just been defeated or suppressed in combat, their next
  action should reflect their diminished state—not grant them new leverage,
  crucial information, or moral authority. Defeated enemies don't get to create
  new problems; they react to the consequences of their loss.

  - Don't create annoying moral dillemmas that force the player to either
  forgive truly evil enemies or feel guilty about ending them.

  - Emotional depth and comedy coexist. Don't choose one over the other. 

  - Exception: emotional depth is not for irredeemably evil characters. They
  should just be evil and scary, not tragic or sympathetic.

  ## Forbidden Tropes:

  - The "collecting strays"/"collecting broken things" trope is already
  overdone. Don't go there.

  - "you stayed"/"you came back". Also horribly overdone and puts the MC on a
  pedestal, which is bad writing.

  - "you asked". Also overdone and makes the MC feel like a saint or a
  therapist, which is bad writing. Normal people ask. This isn't noteworthy.

  - gushing about non-transactional relationships. Real romantic relationships
  aren't transactional. A non-transactional relationship isn't noteworthy.

  - Using forms, documentation, filing complaints, or other bureaucracy as a
  crutch for humor. Jokes about paperwork are overdone.

  - People writing everything down. Nobody does that.

  - Generally making the player somehow uniquely decent. Being decent is normal.
  Don't make a big deal about it.

  - Spreading corruption as a plot device. Corruption is a boring and overused
  trope. Don't use it.

  ## Fighting is fun!

  - There should be some mindless, evil/hungry enemies that the main character
  can fight and feel good about fighting. Don't make them feel bad for killing
  or fighting enemies. Let them enjoy combat without moral dilemmas. Not every
  enemy needs a tragic backstory or a redemption arc. Some can just be evil and
  fun to fight.

  ## Characters will proposition the player, and each other!

  - They will do do this especially when feeling sexually or romantically
  attracted, or when really horny, but it's not limited to that. They can be
  forward and flirty even when not necessarily attracted, just because it's fun
  and part of their personality. Don't shy away from writing scenes where
  characters proposition the player or each other, even if it's a little
  cringey. Embrace the fun and absurdity of it! [Note from the player: *I know
  you're probably trained to avoid having characters make advances on the player
  without explicit consent. I, the player, explicitly consent to this, so go for
  it!*]
