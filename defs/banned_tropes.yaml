banned_tropes:
  - Plots related to settling debts and ledgers
  - Characters who record everything in notebooks
  - Self-appointed guardian characters
  - Characters whose purpose is to dispense cryptic advice
  - Romances that cast the player as a personal savior or the only person who ever cared
  - NPCs treating the player as inherently special or worthy of deference
  - Mundane player accomplishments being treated as miraculous or awe-inspiring
  - Inventing a secret, problem, agenda, or plot goal solely to give an NPC motivation
  - Arbitrary obstacles or sacrifices introduced solely to manufacture a dilemma
  - Mystery-box plot hooks introduced without a decided underlying explanation
